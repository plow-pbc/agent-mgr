name: Propose Hermes image update

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: propose-hermes-image-update
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'plow-pbc/agent-mgr'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Resolve the latest stable Hermes release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_hermes_image.py --write --github-output "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.update.outputs.changed == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e

      - name: Test the proposed lock
        if: steps.update.outputs.changed == 'true'
        run: |
          uv run --no-project --python 3.13 --with pytest==8.4.2 \
            --with pyyaml==6.0.2 pytest -q

      - name: Publish the proposal branch
        if: steps.update.outputs.changed == 'true'
        env:
          BRANCH: automation/hermes-image-update
          RELEASE_TAG: ${{ steps.update.outputs.release_tag }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --heads origin "${BRANCH}" | cut -f1)"
          git switch -c "${BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/stack.json tests/test_json_contract.py
          git diff --cached --check
          git commit -m "chore: update Hermes image to ${RELEASE_TAG}"
          if [ -n "${remote_sha}" ]; then
            git push \
              --force-with-lease="refs/heads/${BRANCH}:${remote_sha}" \
              origin "HEAD:refs/heads/${BRANCH}"
          else
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi

      - name: Open or refresh the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/hermes-image-update
          RELEASE_TAG: ${{ steps.update.outputs.release_tag }}
          CURRENT_DIGEST: ${{ steps.update.outputs.current_digest }}
          CANDIDATE_DIGEST: ${{ steps.update.outputs.candidate_digest }}
          CURRENT_REVISION: ${{ steps.update.outputs.current_revision }}
          RELEASE_REVISION: ${{ steps.update.outputs.release_revision }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          cat >"${body}" <<EOF
          ## Purpose

          Keep the shared Hermes runtime from silently drifting behind stable releases without replacing an immutable, reviewable digest with a moving tag. The previous manual bump followed roughly a month of drift and fixed context compaction that could not complete on the older image.

          This automation only opens a proposal. It does not restart or update any running agent.

          ## Proposed update

          - Release: \`${RELEASE_TAG}\`
          - Current digest: \`${CURRENT_DIGEST}\`
          - Candidate digest: \`${CANDIDATE_DIGEST}\`
          - Current source revision: \`${CURRENT_REVISION}\`
          - Release source revision: \`${RELEASE_REVISION}\`

          ## Safety checks

          - selects GitHub's latest non-draft, non-prerelease Hermes release;
          - requires the Docker image to contain both linux/amd64 and linux/arm64;
          - verifies that both platform images have the release commit in their OCI provenance label;
          - refuses diverged history and refuses to move behind the currently pinned image;
          - preserves the immutable digest pin and runs the full agent-mgr test suite before publishing this branch.

          ## Hackathon context

          This contribution was developed by a participant in the Plow hackathon.

          Related to #2. This proposal automates the local fleet pin, but it does not replace the broader cross-stack alignment described in that issue.

          _Generated by the repository's Propose Hermes image update workflow._
          EOF
          title="chore: update Hermes image to ${RELEASE_TAG}"
          number="$(gh pr list --state open --head "${BRANCH}" --json number --jq '.[0].number // empty')"
          if [ -n "${number}" ]; then
            gh pr edit "${number}" --title "${title}" --body-file "${body}"
          else
            gh pr create --base main --head "${BRANCH}" --title "${title}" --body-file "${body}"
          fi
