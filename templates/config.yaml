# The declarative half of this agent's home -- everything that is a deliberate
# choice for this deployment. Keys equal to the image's own defaults are
# deliberately absent, so the pinned image supplies its current defaults rather
# than a frozen snapshot of them.
# One session per group chat, shared by every participant. Present despite the
# "absent keys mean image defaults" rule above: the image default (true) splits
# a group thread into per-sender sessions, and the plow-chat plugin's
# config.extra flag never reaches the gateway session store.
group_sessions_per_user: false
model:
  default: gpt-5.5
  provider: openai-codex
# Outcome memories need room: the image default (2200 chars, ~800 tokens)
# fills with durable technique notes, so one-line records of consequential
# actions (payments, sends, bookings) lose the consolidation fight, and a
# sibling session later answers "did that happen?" from stale session
# memory. ~3x gives the outcome journal room; the write-an-outcome rule
# lives in life-assistant-hermes-agent's SOUL.md.
memory:
  memory_char_limit: 6000
# On a full-budget timeout the aux client skips the same-provider retry for
# compression and falls back -- but with no chain configured there is nowhere to
# land, so an oversized session freezes and every turn re-stalls. That cost a
# fleet agent ~30h on 2026-08-31 (plow-pbc/life-assistant-hermes-agent#71).
#
# A second model on the agent's OWN codex auth closes it -- no new credential,
# because the skip is (provider, model)-scoped. Note this is gpt-5.6-sol while
# `model.default` above is gpt-5.5: the two MUST differ, or the skip discards
# the fallback and the chain is inert. Change one and check the other.
#
# A ChatGPT-account codex serves ONLY those two ids; every other one 400s. Verify
# a swap by the fallback log lines, never the return value -- the implicit
# main-model fallback reports success for a model the account actually rejected.
#
# No task-level `timeout` on purpose. The image floors a config-derived
# compression timeout at 300s so a slow reasoning summary is not cut off into
# the deterministic context marker (#54915) -- a lower value is silently raised,
# and setting one that DID bite would re-introduce that bug. A genuinely dead
# stream is caught at 60s by the no-progress timeout, not by this budget.
# The chain entry keeps its own 300s: without one it inherits the 30s auxiliary
# default, far too short for a summary.
auxiliary:
  compression:
    fallback_chain:
    - provider: openai-codex
      model: gpt-5.6-sol
      timeout: 300

mcp_servers:
  # Plow Latch, reached over the Plow relay: the browser and filesystem this
  # agent works on are the operator's Mac, not this container. The relay
  # authorises the connection and tells the Mac who is asking; the Mac
  # authorises each action. Both values come from the agent's own dotenv, so
  # the credential never appears in this file or in a URL in git.
  #
  # THIS BLOCK IS THE DECLARATION. An agent that drives no Mac deletes it --
  # leaving it in place with blank DOMO_* values is a configured latch with no
  # credential, which is a broken agent rather than an unconfigured one, and
  # `agent-mgr check-latch` says so.
  #
  # Baseline rather than optional because most agents want it: a new one is
  # wired for Latch and you remove this if it drives nothing.
  #
  # Keyed `plow`, and that name is a contract rather than a label: Hermes
  # prefixes the model's tool names with it, so this entry is what makes the
  # relay's tools arrive as `mcp__plow__plow_run_command`. The base image keys
  # it `plow` (plow-hermes-agent #15) and every shipped agent matches. A
  # scaffold that said `latch` handed new agents `mcp__latch__*` instead, and
  # a skill sheet naming the plow-prefixed tool would then find nothing --
  # silently, because an unregistered tool is not an error, just a step that
  # never runs.
  plow:
    url: https://api.plow.co/v1/relay/devices/${DOMO_DEVICE_UID}/mcp
    headers:
      Authorization: Bearer ${DOMO_MCP_TOKEN}
    enabled: true
plugins:
  enabled:
  - plow-chat-platform
  entries:
    plow-chat-platform:
      # The plugin registers one platform and no tools. Denying overrides keeps
      # a future plugin change from silently shadowing an image tool of the
      # same name, which would be invisible from this file.
      allow_tool_override: false
platforms:
  plow_chat:
    enabled: true
