# The legacy boot shape's own additions on top of compose.base.yml (image,
# identity, timing, no ports -- see that file), rendered together for every
# agent still on today's contract. An agent whose home dotenv sets
# AGENT_BOOT_CONTRACT=plow-init renders compose.plow-init.yml instead --
# a full sibling overlay, not merged with this one -- because its base image
# owns its own boot chain and starting this file's command/entrypoint
# alongside it would start a second gateway. See that file for why. No agent
# renders from it until its own home dotenv says so.
services:
  hermes:
    # Named rather than inherited. `command` below is arguments FOR the image's
    # entrypoint, not a program -- and the shared cloud image clears ENTRYPOINT
    # so its host can boot /sbin/init, which leaves `gateway` to be exec'd as a
    # binary that does not exist. This is upstream's own entrypoint, so it is a
    # no-op on an image that still declares one.
    entrypoint: ["/opt/hermes/docker/entrypoint-dispatch.sh"]
    command: ["gateway", "run"]
    volumes:
      # This agent's own home, and the only mount the template makes.
      # Deliberately never a sibling's: each is another agent's live state, and
      # sharing one would hand two gateways a single auth.json and a single
      # dotenv -- including one PLOW_HOME_CHANNEL, so whichever started last
      # would own the chat.
      - ${AGENT_HOME:?set by agent-mgr from the instance descriptor}:/opt/data
    environment:
      - S6_SERVICES_GRACETIME=30000
      # No credentials here, deliberately, and this is the whole contract for
      # them: the gateway reads /opt/data/.env, which is the agent's own home
      # through the mount above. Passing them here would interpolate from the
      # shell, so following the documented bring-up would inject empty strings
      # that shadow the real values.
