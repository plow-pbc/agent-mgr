# Layered in LAST by agent-mgr for the current boot contract
# (HERMES_HOME=/var/lib/hermes), after the instance's own compose.override.yml:
# what this file declares is the boot contract's and no override can retarget
# it. CMD ["/init"] boots the image's own supervised hermes-gateway, gated by a
# plow-init oneshot that refuses to start unless /var/lib/plow/credentials
# exists as root:root mode 600. Neither entrypoint nor command is overridden
# here -- overriding them would leave that supervised gateway un-started while
# agent-mgr's own `command:` started a second one beside it.
#
# AGENT_CREDENTIALS_HOST is a path OUTSIDE every agent's own home
# (boot_contract.credentials_host_path) -- never under the mount above, which
# this same container fully controls and could otherwise replace with a
# symlink to a SIBLING agent's credential file. The bind is read-only in
# addition to that, not instead of it: a root cont-init step (baked into the
# image) promotes the read side into /var/lib/plow/credentials, and this
# container never needs write access to its own source copy.
services:
  hermes:
    volumes:
      - ${AGENT_CREDENTIALS_HOST:?set by agent-mgr, derived from the image}:/var/lib/plow/credentials.host:ro
